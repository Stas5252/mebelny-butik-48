<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1815"/>
      <stop offset="50%" stop-color="#0E0D0B"/>
      <stop offset="100%" stop-color="#080706"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E4C3"/>
      <stop offset="50%" stop-color="#C8A87A"/>
      <stop offset="100%" stop-color="#9B7846"/>
    </linearGradient>
    <linearGradient id="gold-subtle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(245,228,195,0.4)"/>
      <stop offset="100%" stop-color="rgba(155,120,70,0.1)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background tile with subtle luxury gold border -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.35"/>
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.18"/>

  <!-- Architectural monogram: Elegant stylized "Б" (Бутик) + "48" badge -->
  <g id="emblem" transform="translate(0, 0)">
    <!-- Stylized Serif Monogram 'Б' -->
    <!-- Top horizontal architrave bar -->
    <path d="M140 135 H362 C376 135 384 143 384 153 C384 163 376 171 362 171 H198 V236 H312 C356 236 388 268 388 314 C388 360 354 395 306 395 H154 C142 395 132 385 132 373 V153 C132 143 140 135 140 135 Z" 
          fill="none" stroke="url(#gold)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Inner counter loop of 'Б' with luxury bevel -->
    <path d="M198 286 H304 C328 286 344 300 344 322 C344 344 328 358 304 358 H198 V286 Z" 
          fill="url(#gold-subtle)" stroke="url(#gold)" stroke-width="8"/>

    <!-- Subtle accent serif foot -->
    <rect x="114" y="380" width="48" height="15" rx="4" fill="url(#gold)"/>
    <rect x="114" y="130" width="40" height="15" rx="4" fill="url(#gold)"/>

    <!-- Minimalist "48" region stamp badge in bottom right -->
    <g transform="translate(322, 332)">
      <rect x="0" y="0" width="116" height="52" rx="26" fill="#151412" stroke="url(#gold)" stroke-width="3"/>
      <text x="58" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" 
            font-size="28" font-weight="800" fill="url(#gold)" text-anchor="middle" letter-spacing="2">48</text>
    </g>
  </g>
</svg>
